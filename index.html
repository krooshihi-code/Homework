<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HT English - Homework Library</title>

<style>
:root{
  --blue:#0b63ce;
  --navy:#082b5c;
  --sky:#eaf4ff;
  --text:#17324d;
  --muted:#678;
  --shadow:0 12px 30px rgba(8,43,92,.12);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#f7fbff,#edf6ff);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:white;
  padding:22px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.top{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:54px;
  height:54px;
  border-radius:16px;
  background:white;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:20px;
}

h1{
  margin:0;
  font-size:24px;
}

.sub{
  margin-top:3px;
  font-size:13px;
  opacity:.9;
}

.creator{
  margin-top:4px;
  font-size:12px;
  opacity:.75;
}

.search{
  flex:1;
  max-width:430px;
  min-width:230px;
}

.search input{
  width:100%;
  padding:13px 16px;
  border:0;
  border-radius:14px;
  font-size:15px;
  outline:none;
}

.hero{
  max-width:1180px;
  margin:auto;
  padding:28px 20px 18px;
}

.hero-box{
  background:white;
  border-radius:24px;
  padding:28px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero h2{
  margin:0 0 8px;
  font-size:30px;
  color:var(--navy);
}

.hero p{
  margin:0;
  color:var(--muted);
}

.stats{
  white-space:nowrap;
  background:var(--sky);
  color:var(--blue);
  padding:14px 18px;
  border-radius:16px;
  font-weight:700;
}

main{
  max-width:1180px;
  margin:auto;
  padding:0 20px 50px;
}

.folder{
  background:white;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.folder-head{
  padding:19px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(90deg,#fff,#eef6ff);
  cursor:pointer;
}

.folder-title{
  display:flex;
  align-items:center;
  gap:11px;
}

.folder-icon{
  font-size:23px;
}

.folder-head h3{
  margin:0;
  color:var(--navy);
}

.badge{
  background:var(--sky);
  color:var(--blue);
  padding:7px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

.chev{
  display:inline-block;
  color:var(--blue);
  font-weight:800;
  margin-left:7px;
  transition:.2s;
}

.folder-body{
  display:none;
  padding:14px 18px 18px;
}

.folder.open .folder-body{
  display:block;
}

.folder.open .chev{
  transform:rotate(90deg);
}

.lessons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
}

.lesson{
  display:block;
  text-decoration:none;
  color:var(--text);
  border:1px solid #dceaff;
  border-radius:15px;
  padding:15px;
  background:#fbfdff;
  transition:.2s;
}

.lesson:hover{
  transform:translateY(-2px);
  border-color:#8fc2ff;
  box-shadow:0 8px 18px rgba(11,99,206,.12);
}

.lesson strong{
  display:block;
  color:var(--navy);
  margin-bottom:6px;
}

.lesson small{
  color:var(--muted);
}

.empty{
  display:none;
  text-align:center;
  padding:40px;
  background:white;
  border-radius:20px;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

@media(max-width:700px){
  .hero-box{
    display:block;
  }

  .stats{
    display:inline-block;
    margin-top:16px;
  }

  .hero h2{
    font-size:24px;
  }

  .lessons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <div class="brand">
      <div class="logo">HT</div>

      <div>
        <h1>HT English Center</h1>
        <div class="sub">Homework Library 2026</div>
        <div class="creator">Created by Uncle Iroh (HieuNguyen)</div>
      </div>
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Tìm học sinh hoặc bài tập..."
      >
    </div>

  </div>
</header>


<section class="hero">
  <div class="hero-box">

    <div>
      <h2>Kho bài tập trực tuyến</h2>
      <p>Chọn học sinh và bài tập để bắt đầu.</p>
    </div>

    <div class="stats" id="stats">
      1 bài tập
    </div>

  </div>
</section>


<main>

  <div id="content"></div>

  <div class="empty" id="empty">
    Không tìm thấy bài tập phù hợp.
  </div>

</main>


<footer>
  © 2026 HT English Center
</footer>


<script>

const DATA = [
  {
    student: "Anna",

    lessons: [
      {
        title: "Grade 6 – A2+ Practice Test",

        href: "Anna/Grade_6_A2_Practice_Test_Embedded_Audio(1).html",

        description: "Bài luyện tập Grade 6 trình độ A2+"
      }
    ]
  }
];


const content = document.getElementById("content");

const search = document.getElementById("search");

const empty = document.getElementById("empty");

const stats = document.getElementById("stats");


const totalLessons = DATA.reduce(
  (total, group) => total + group.lessons.length,
  0
);

stats.textContent = totalLessons + " bài tập";


function render(q=""){

  content.innerHTML = "";

  const needle = q.toLowerCase().trim();

  let found = false;


  DATA.forEach(group => {

    const lessons = group.lessons.filter(item =>

      !needle ||

      (
        group.student +
        " " +
        item.title +
        " " +
        item.description
      )
      .toLowerCase()
      .includes(needle)

    );


    if(!lessons.length) return;


    found = true;


    const folder = document.createElement("div");

    folder.className =
      "folder" +
      (needle ? " open" : "");


    folder.innerHTML = `

      <div class="folder-head">

        <div class="folder-title">

          <span class="folder-icon">
            📁
          </span>

          <h3>
            ${group.student}
          </h3>

        </div>


        <div>

          <span class="badge">
            ${lessons.length} bài
          </span>

          <span class="chev">
            ›
          </span>

        </div>

      </div>


      <div class="folder-body">

        <div class="lessons"></div>

      </div>

    `;


    folder
      .querySelector(".folder-head")
      .onclick = () => {

        folder.classList.toggle("open");

      };


    const list =
      folder.querySelector(".lessons");


    lessons.forEach(item => {

      const a =
        document.createElement("a");


      a.className = "lesson";

      a.href = item.href;


      a.innerHTML = `

        <strong>
          ${item.title}
        </strong>

        <small>
          ${item.description}
        </small>

      `;


      list.appendChild(a);

    });


    content.appendChild(folder);

  });


  empty.style.display =
    found ? "none" : "block";

}


search.addEventListener(
  "input",
  () => render(search.value)
);


render();

</script>

</body>
</html>
